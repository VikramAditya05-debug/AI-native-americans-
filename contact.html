<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Us | AI Institute for Native Americans</title>
    <meta name="description" content="Contact the AI Institute for Native Americans about seminars, group training, and partnerships.">
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body class="contact-exact-page">
    <main class="contact-exact-shell" aria-label="Contact Us page">
      <img class="contact-exact-image" src="assets/contact-exact.png" alt="Contact Us page for AI Institute for Native Americans">

      <a class="contact-hotspot contact-nav-home" href="index.html" aria-label="Home"></a>
      <a class="contact-hotspot contact-nav-about" href="about.html" aria-label="About Us"></a>
      <a class="contact-hotspot contact-nav-seminars" href="seminars.html" aria-label="Seminars"></a>
      <a class="contact-hotspot contact-nav-causes" href="causes.html" aria-label="Causes and Giving"></a>
      <a class="contact-hotspot contact-nav-why" href="why-it-matters.html" aria-label="Why It Matters"></a>
      <a class="contact-hotspot contact-nav-contact" href="contact.html" aria-label="Contact Us"></a>
      <a class="contact-hotspot contact-nav-register" href="register.html" aria-label="Register Now"></a>

      <form class="contact-exact-form" data-contact-form aria-label="Send us a message">
        <label class="contact-exact-label contact-name-label" for="contactName">Full Name</label>
        <input class="contact-control contact-field-name" id="contactName" name="fullName" autocomplete="name" required>

        <label class="contact-exact-label contact-email-label" for="contactEmail">Email Address</label>
        <input class="contact-control contact-field-email" id="contactEmail" name="email" type="email" autocomplete="email" required>

        <label class="contact-exact-label contact-organization-label" for="contactOrganization">Organization / Tribe</label>
        <input class="contact-control contact-field-organization" id="contactOrganization" name="organization" autocomplete="organization">

        <label class="contact-exact-label contact-subject-label" for="subject">Subject</label>
        <select class="contact-control contact-field-subject" id="subject" name="subject" required>
          <option value="">Select a topic</option>
          <option>Seminar Registration</option>
          <option>Group Training</option>
          <option>Partnerships</option>
          <option>Payment Question</option>
          <option>Other</option>
        </select>

        <label class="contact-exact-label contact-message-label" for="message">Message</label>
        <textarea class="contact-control contact-field-message" id="message" name="message" required></textarea>

        <button class="contact-hotspot contact-send-button" type="submit" aria-label="Send Message">Send Message</button>
        <p class="status-message contact-status-hidden" data-contact-status></p>
      </form>

      <a class="contact-hotspot contact-phone-link" href="tel:5551234567" aria-label="Call phone number"></a>
      <a class="contact-hotspot contact-email-link" href="mailto:info@AIInstituteForNativeAmericans.com" aria-label="Email AI Institute for Native Americans"></a>
      <a class="contact-hotspot contact-group-info" href="mailto:info@AIInstituteForNativeAmericans.com?subject=Group%20Training%20Request" aria-label="Request group information"></a>
      <a class="contact-hotspot contact-view-dates" href="seminars.html" aria-label="View all dates"></a>
      <a class="contact-hotspot contact-subscribe" href="contact.html" aria-label="Subscribe"></a>

      <a class="contact-hotspot contact-footer-home" href="index.html" aria-label="Footer home"></a>
      <a class="contact-hotspot contact-footer-about" href="about.html" aria-label="Footer about us"></a>
      <a class="contact-hotspot contact-footer-seminars" href="seminars.html" aria-label="Footer seminars"></a>
      <a class="contact-hotspot contact-footer-causes" href="causes.html" aria-label="Footer causes and giving"></a>
      <a class="contact-hotspot contact-footer-why" href="why-it-matters.html" aria-label="Footer why it matters"></a>
      <a class="contact-hotspot contact-footer-contact" href="contact.html" aria-label="Footer contact us"></a>

      <div class="contact-exact-accessible">
        <h1>Contact Us</h1>
        <p>We are here to help and answer any questions about seminars, group training, or partnerships.</p>
      </div>
    </main>
    <script src="assets/script.js"></script>
  </body>
</html>
